version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Toolchain semantics are owned by rust-toolchain.toml plus the local
      # setup-rust action. Keep the underlying installer action SHA deliberate;
      # ci/toolchain-contract.sh guards the canonical/MSRV/latest lane split.
      - dependency-name: "dtolnay/rust-toolchain"
