name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  msrv:
    name: MSRV (Rust 1.85)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Check all targets and features
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Run tests
        run: cargo test --locked --workspace --all-features

  test:
    name: Test stable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install latest stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --locked --workspace --all-features

  quality:
    name: Formatting, Clippy, and docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install latest stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Build API documentation
        run: cargo doc --locked --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Build library for README tests
        run: cargo build --locked --workspace --all-features

      - name: Test English README examples
        run: >-
          rustdoc --test README.md --edition 2024
          -L dependency=target/debug/deps
          --extern cordis=target/debug/libcordis.rlib

      - name: Test Chinese README examples
        run: >-
          rustdoc --test README.zh-CN.md --edition 2024
          -L dependency=target/debug/deps
          --extern cordis=target/debug/libcordis.rlib

      - name: Test cordis-include README examples
        run: >-
          rustdoc --test crates/cordis-include/README.md --edition 2024
          -L dependency=target/debug/deps
          --extern cordis=target/debug/libcordis.rlib
          --extern cordis_include=target/debug/libcordis_include.rlib

      - name: Test cordis-include Chinese README examples
        run: >-
          rustdoc --test crates/cordis-include/README.zh-CN.md --edition 2024
          -L dependency=target/debug/deps
          --extern cordis=target/debug/libcordis.rlib
          --extern cordis_include=target/debug/libcordis_include.rlib

      - name: Test cordis-group README examples
        run: >-
          rustdoc --test crates/cordis-group/README.md --edition 2024
          -L dependency=target/debug/deps
          --extern cordis=target/debug/libcordis.rlib
          --extern cordis_group=target/debug/libcordis_group.rlib

      - name: Test cordis-group Chinese README examples
        run: >-
          rustdoc --test crates/cordis-group/README.zh-CN.md --edition 2024
          -L dependency=target/debug/deps
          --extern cordis=target/debug/libcordis.rlib
          --extern cordis_group=target/debug/libcordis_group.rlib

      - name: Test cordis-loader README examples
        run: >-
          rustdoc --test crates/cordis-loader/README.md --edition 2024
          -L dependency=target/debug/deps
          --extern cordis=target/debug/libcordis.rlib
          --extern cordis_include=target/debug/libcordis_include.rlib
          --extern cordis_loader=target/debug/libcordis_loader.rlib

      - name: Test cordis-loader Chinese README examples
        run: >-
          rustdoc --test crates/cordis-loader/README.zh-CN.md --edition 2024
          -L dependency=target/debug/deps
          --extern cordis=target/debug/libcordis.rlib
          --extern cordis_include=target/debug/libcordis_include.rlib
          --extern cordis_loader=target/debug/libcordis_loader.rlib
