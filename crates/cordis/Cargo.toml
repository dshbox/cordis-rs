[package]
name = "cordis-rs"
version = "0.8.6"
description = "Application-facing facade for the Cordis v3 runtime"
keywords = ["cordis", "plugin", "events", "lifecycle", "framework"]
categories = ["asynchronous", "rust-patterns"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"

[lib]
name = "cordis"
path = "src/lib.rs"

[features]
default = []

[dependencies]
cordis-core.workspace = true

[dev-dependencies]
# Deliberately activates cordis-core/internal-api through feature unification so
# facade compile-fail tests prove the workspace-only seam still cannot escape.
cordis-core = { workspace = true, features = ["internal-api"] }
trybuild.workspace = true

[lints]
workspace = true
