[package]
name = "cordis-rs"
version = "0.8.22"
description = "Application-facing facade for the Cordis v3 runtime"
keywords = ["cordis", "plugin", "events", "lifecycle", "framework"]
categories = ["asynchronous", "rust-patterns"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"

[lib]
name = "cordis"
path = "src/lib.rs"

[features]
default = []

[dependencies]
cordis-core.workspace = true

[dev-dependencies]
# Reproduce a real downstream graph: published sibling crates activate
# cordis-core/internal-api, which Cargo unifies onto this package's direct core
# dependency. Tests then prove direct core reachability without facade re-export.
cordis-timer.workspace = true
cordis-loader.workspace = true
trybuild.workspace = true

[lints]
workspace = true
