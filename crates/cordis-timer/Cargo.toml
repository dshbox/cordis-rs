[package]
name = "cordis-timer"
description = "Generation-owned sleep, interval, and timeout operations for Cordis v3"
keywords = ["cordis", "timer", "async", "lifecycle"]
categories = ["asynchronous", "rust-patterns"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
# Tokio time enters through this leaf crate rather than cordis-core (ADR 0036).
tokio = { workspace = true, features = ["time"] }
thiserror = { workspace = true }
# the timeout shape's fiber-effect binding (the ticket-20 comment's
# promised re-add): the shape registers its cancellation watch as an
# effect of the calling context's fiber
cordis-core = { workspace = true, features = ["internal-api"] }
# the Interval operation implements Stream
futures = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
futures = { workspace = true }
parking_lot = { workspace = true }
trybuild = { workspace = true }
