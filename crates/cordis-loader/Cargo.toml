[package]
name = "cordis-loader"
description = "Immutable declarative loading plans and typed resolution for Cordis v3"
keywords = ["cordis", "plugin", "loader", "config"]
categories = ["config", "rust-patterns"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
cordis-core = { workspace = true, features = ["internal-api"] }
# serde/serde_json stay in the loader and never enter core (ADR 0036).
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true }
trybuild = { workspace = true }
