[package]
name = "cordis-core"
description = "Typed lifecycle, services, events, effects, and observation for the Cordis v3 runtime"
keywords = ["cordis", "plugin", "events", "lifecycle", "runtime"]
categories = ["asynchronous", "rust-patterns"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[features]
default = []
# Published sibling crates use this non-default implementation seam. Downstream
# use is unsupported; sibling compatibility is governed by docs/compatibility-policy.md.
internal-api = []
# Exhaustive concurrency models run in a dedicated CI lane, not the default test matrix.
loom-tests = []

[dependencies]
# Core stays dependency-clean at the semantic crate seam (ADR 0036): no serde,
# no serde_json, and no Tokio `time` feature.
tokio = { workspace = true }
parking_lot = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["time"] }
trybuild = { workspace = true }
serde = { workspace = true }
loom = { workspace = true }
criterion = { workspace = true }

[[test]]
name = "loom_era"
path = "tests/loom_era.rs"
required-features = ["loom-tests"]

[[test]]
name = "loom_inertia"
path = "tests/loom_inertia.rs"
required-features = ["loom-tests"]

[[bench]]
name = "runtime_paths"
harness = false

[lints]
workspace = true
