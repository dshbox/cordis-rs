[workspace]
resolver = "3"
members = [
    "crates/cordis",
    "crates/cordis-core",
    "crates/cordis-timer",
    "crates/cordis-loader",
    "crates/cordis-wasm",
    "examples/common",
    "examples/hello_plugin",
    "examples/gateway",
    "examples/worker_daemon",
    "examples/scopes_tenants",
    "examples/logging_exporters",
    "examples/chat_capstone",
    "examples_wasm/runner",
]

[workspace.package]
version = "0.3.6"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/dshbox/cordis-rs"

[workspace.dependencies]
cordis-core = { path = "crates/cordis-core", version = "0.3.6" }
cordis-timer = { path = "crates/cordis-timer", version = "0.3.6" }
cordis-loader = { path = "crates/cordis-loader", version = "0.3.6" }
cordis-rs = { path = "crates/cordis", version = "0.8.21" }
examples-common = { path = "examples/common" }
# Core intentionally omits Tokio's `time` feature; time operations belong to
# cordis-timer, while serde-backed loading belongs to cordis-loader (ADR 0036).
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "sync", "macros"] }
parking_lot = "0.12"
thiserror = "2"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trybuild = "1"
loom = "0.7.2"
criterion = { version = "0.8.2", default-features = false, features = ["async_tokio", "cargo_bench_support"] }
# `async func` requires Wasmtime's current Component Model async ABI. Wasmtime
# 36 was probed but cannot consume Components generated by `wit-bindgen 0.62`;
# Wasmtime 48 is the first compatible non-RC pair validated by this spike. This
# is a compatibility constraint, not a performance choice, and deliberately
# exceeds the workspace MSRV. `cordis-wasm` must therefore not remain in the
# published workspace until that boundary is resolved.
wasmtime = { version = "=48.0.0", default-features = false, features = ["anyhow", "async", "component-model", "component-model-async", "cranelift", "runtime"] }
wasmtime-wasi = { version = "=48.0.0", default-features = false, features = ["p2"] }

[workspace.lints.rust]
missing_docs = { level = "warn" }

[workspace.lints.clippy]
dbg_macro = { level = "deny" }
todo = { level = "deny" }
