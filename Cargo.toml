[workspace]
resolver = "3"
members = [
    "crates/cordis",
    "crates/cordis-core",
    "crates/cordis-timer",
    "crates/cordis-loader",
    "examples/common",
    "examples/hello_plugin",
    "examples/gateway",
    "examples/worker_daemon",
    "examples/scopes_tenants",
    "examples/logging_exporters",
    "examples/chat_capstone",
]

[workspace.package]
version = "0.2.4"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/dshbox/cordis-rs"

[workspace.dependencies]
cordis-core = { path = "crates/cordis-core", version = "0.2.4" }
cordis-timer = { path = "crates/cordis-timer", version = "0.2.4" }
cordis-loader = { path = "crates/cordis-loader", version = "0.2.4" }
cordis-rs = { path = "crates/cordis", version = "0.8.4" }
examples-common = { path = "examples/common" }
# Core intentionally omits Tokio's `time` feature; time operations belong to
# cordis-timer, while serde-backed loading belongs to cordis-loader (ADR 0036).
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "sync", "macros"] }
parking_lot = "0.12"
thiserror = "2"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trybuild = "1"
loom = "0.7.2"

[workspace.lints.rust]
missing_docs = { level = "warn" }
