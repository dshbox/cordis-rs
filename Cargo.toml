[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.4.3"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/dshbox/cordis-rs"

[workspace.dependencies]
cordis-cli = { version = "0.0.4", path = "crates/cordis-cli" }
cordis-group = { version = "0.0.3", path = "crates/cordis-group" }
cordis-include = { version = "0.0.6", path = "crates/cordis-include" }
cordis-loader = { version = "0.0.5", path = "crates/cordis-loader" }
cordis-rs = { version = "0.4.3", path = "crates/cordis" }
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
