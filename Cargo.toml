[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/dshbox/cordis-rs"

[workspace.dependencies]
cordis-cli = { version = "0.0.20", path = "crates/cordis-cli" }
cordis-group = { version = "0.0.15", path = "crates/cordis-group" }
cordis-include = { version = "0.0.21", path = "crates/cordis-include" }
cordis-loader = { version = "0.0.21", path = "crates/cordis-loader" }
cordis-rs = { version = "0.6.0", path = "crates/cordis" }
indexmap = { version = "2", features = ["serde"] }
libloading = "0.8"
ryu = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
unsafe-libyaml = "0.2"
